    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="EatLog" />

    <meta property="og:url" content="https://eatlog-tracker.vercel.app/" />
    <meta property="og:image" content="https://eatlog-tracker.vercel.app/icons/icon-180.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EatLog — meal tracker and food diary" />
    <meta name="twitter:description" content="Track meals, snacks, meal intervals, and eating rhythm in a simple offline-first web app." />

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "EatLog",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "url": "https://eatlog-tracker.vercel.app/",
        "image": "https://eatlog-tracker.vercel.app/icons/icon-180.png",
        "description": "EatLog is a simple meal tracker, food diary, and snack log for tracking eating rhythm, meal intervals, and night fasting windows.",
        "inLanguage": ["en", "ru"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Person",
          "email": "madebyalbi@gmail.com"
        },
        "featureList": [
          "Meal tracker",
          "Food diary",
          "Snack log",
          "Meal intervals",
          "Offline support",
          "No registration"
        ]
      }
    </script>
    <script>
      (function () {
        const storageKey = "eatlog_lang";
        const stored = localStorage.getItem(storageKey);
        const browserLanguages = Array.isArray(navigator.languages) && navigator.languages.length
          ? navigator.languages
          : [navigator.language || "en"];
        const browserLang = browserLanguages.some(function (item) {
          return String(item).toLowerCase().indexOf("ru") === 0;
        }) ? "ru" : "en";
        const lang = stored === "ru" || stored === "en" ? stored : browserLang;
        const copy = {
          en: {
            title: "EatLog — meal tracker, food diary, and snack log",
            description: "EatLog — a simple meal tracker, food diary, and snack log. Track meal intervals, eating rhythm, and night fasting windows. Works offline with no sign-up.",
            ogLocale: "en_US",
            ogTitle: "EatLog — meal tracker and food diary",
            ogDescription: "A local-first meal tracker for meals, snacks, and meal intervals. Works offline with no registration.",
            twitterTitle: "EatLog — meal tracker and food diary",
            twitterDescription: "Track meals, snacks, meal intervals, and eating rhythm in a simple offline-first web app."
          },
          ru: {
            title: "EatLog — дневник питания и трекер приёмов пищи",
            description: "EatLog — простой дневник питания и трекер приёмов пищи. Отмечайте еду и перекусы, интервалы между приёмами пищи и ночные перерывы. Работает офлайн и без регистрации.",
            ogLocale: "ru_RU",
            ogTitle: "EatLog — дневник питания и трекер еды",
            ogDescription: "Локальный дневник питания для приёмов пищи, перекусов и интервалов. Работает офлайн и без регистрации.",
            twitterTitle: "EatLog — дневник питания и трекер еды",
            twitterDescription: "Отмечайте приёмы пищи, перекусы и интервалы в простом офлайн-дневнике питания."
          }
        };
        const selected = copy[lang];
        document.documentElement.lang = lang;
        document.title = selected.title;
        document.querySelector('meta[name="description"]').setAttribute("content", selected.description);
        document.querySelector('meta[property="og:locale"]').setAttribute("content", selected.ogLocale);
        document.querySelector('meta[property="og:title"]').setAttribute("content", selected.ogTitle);
        document.querySelector('meta[property="og:description"]').setAttribute("content", selected.ogDescription);
        document.querySelector('meta[name="twitter:title"]').setAttribute("content", selected.twitterTitle);
        document.querySelector('meta[name="twitter:description"]').setAttribute("content", selected.twitterDescription);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
